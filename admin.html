<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopNova Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8f5;color:#17251c}.top{background:#fff;border-bottom:1px solid #dfe9e1;padding:16px 22px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:900;color:#16864b}.logo span{color:#ff9d00}.wrap{max-width:1150px;margin:25px auto;padding:0 18px}.card{background:#fff;border:1px solid #e0e9e2;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px #17332108}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;border-radius:16px;background:#eef8f1}.stat b{font-size:28px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer;background:#16864b;color:#fff}.danger{background:#c93a3a}.field{margin:9px 0}.field input,.field select{width:100%;padding:11px;border:1px solid #d6e1d9;border-radius:10px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #edf1ee;text-align:left;font-size:14px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}}
</style></head><body>
<div class="top"><div class="logo">Shop<span>Nova</span> Admin</div><a href="/" style="text-decoration:none;color:#16864b;font-weight:800">← Store</a></div>
<div class="wrap">
<div id="login" class="card"><h2>Admin Login</h2><div class="row"><div class="field"><input id="user" placeholder="Admin username"></div><div class="field"><input id="pass" type="password" placeholder="Admin password"></div></div><button class="btn" onclick="adminLogin()">Login</button><p id="msg"></p></div>
<div id="app" style="display:none">
<div class="grid"><div class="card stat">Products<br><b id="pcount">0</b></div><div class="card stat">Orders<br><b id="ocount">0</b></div><div class="card stat">Customers<br><b id="ccount">0</b></div><div class="card stat">Sales<br><b id="sales">₹0</b></div></div>
<div class="card"><h2>Add Product</h2><div class="row"><div class="field"><input id="name" placeholder="Product name"></div><div class="field"><input id="category" placeholder="Category e.g. Vegetables"></div><div class="field"><input id="unit" placeholder="Unit e.g. 1 kg"></div><div class="field"><input id="emoji" placeholder="Emoji e.g. 🥔"></div><div class="field"><input id="price" type="number" placeholder="Price"></div><div class="field"><input id="mrp" type="number" placeholder="MRP"></div><div class="field"><input id="stock" type="number" placeholder="Stock"></div></div><button class="btn" onclick="addProduct()">Add Product</button></div>
<div class="card"><h2>Recent Orders</h2><table class="table"><thead><tr><th>ID</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Address</th></tr></thead><tbody id="orders"></tbody></table></div>
</div></div>
<script>
let token="";
function adminLogin(){fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("user").value,password:document.getElementById("pass").value})}).then(async r=>{let d=await r.json();if(!r.ok){document.getElementById("msg").textContent=d.error;return}token=d.token;document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";load()})}
async function load(){let r=await fetch("/api/admin/dashboard",{headers:{Authorization:"Bearer "+token}});let d=await r.json();document.getElementById("pcount").textContent=d.products;document.getElementById("ocount").textContent=d.orders;document.getElementById("ccount").textContent=d.customers;document.getElementById("sales").textContent="₹"+Number(d.sales||0).toLocaleString("en-IN");document.getElementById("orders").innerHTML=d.recentOrders.map(o=>`<tr><td>#${o.id}</td><td>${o.customer_name}<br>${o.phone}</td><td>₹${Number(o.total).toLocaleString("en-IN")}</td><td>${o.payment_method}</td><td>${o.status}</td><td>${o.address}</td></tr>`).join("")}
async function addProduct(){const nameEl=document.getElementById("name"),categoryEl=document.getElementById("category"),unitEl=document.getElementById("unit"),emojiEl=document.getElementById("emoji"),priceEl=document.getElementById("price"),mrpEl=document.getElementById("mrp"),stockEl=document.getElementById("stock");let body={name:nameEl.value.trim(),category:categoryEl.value.trim(),unit:unitEl.value.trim(),emoji:emojiEl.value||"🛒",price:Number(priceEl.value),mrp:Number(mrpEl.value||priceEl.value),stock:Number(stockEl.value||0)};let r=await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify(body)});let d=await r.json();alert(d.message||d.error);if(r.ok){name.value=category.value=unit.value=emoji.value=price.value=mrp.value=stock.value="";load()}}
</script></body></html>
